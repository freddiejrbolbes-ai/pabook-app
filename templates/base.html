<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}PaBook{% endblock %}</title>
<meta property="og:title" content="PaBook — Booking App para sa Local Services">
<meta property="og:description" content="Mag-book o mag-request ng quote sa mga negosyo malapit sa'yo — salon, barbershop, mekaniko, trucking, paupahan, at marami pa. Libre at madaling gamitin.">
<meta property="og:type" content="website">
<meta name="description" content="Mag-book o mag-request ng quote sa mga negosyo malapit sa'yo. Libre at madaling gamitin.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap');
  :root{
    --teal-deep:#0F3D3E; --teal-mid:#1B5E5A; --gold:#E8A93B; --gold-bright:#F4C05C;
    --cream:#FBF7EF; --ink:#12201F; --line:#D9CFB8; --red:#C24A3B;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);font-family:'Inter',sans-serif;color:var(--ink);}
  .wrap{max-width:480px;margin:0 auto;min-height:100vh;background:var(--cream);position:relative;padding-bottom:24px;}
  a{color:inherit;text-decoration:none;}

  .topbar{padding:18px 18px 14px;background:var(--teal-deep);color:var(--cream);}
  .topbar .brand{font-family:'Fraunces',serif;font-weight:900;font-size:20px;display:flex;align-items:center;gap:8px;}
  .topbar .sub{font-size:11px;color:#9FC4BE;margin-top:2px;}

  .flash{margin:12px 18px 0;padding:10px 14px;border-radius:10px;font-size:13px;font-weight:600;}
  .flash.success{background:#DCEFE0;color:#1B5E3A;border:1px solid #B7DEC0;}

  .cats{display:flex;gap:10px;padding:14px 18px 4px;overflow-x:auto;}
  .cat{flex:0 0 auto;width:66px;text-align:center;font-size:10px;font-weight:600;color:var(--teal-deep);}
  .cat .ic{width:52px;height:52px;border-radius:16px;background:linear-gradient(160deg,var(--gold-bright),var(--gold));
    display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 6px;
    box-shadow:0 4px 10px rgba(232,169,59,0.3);border:2px solid transparent;}
  .cat.active .ic{border-color:var(--red);}
  .cat.alt .ic{background:linear-gradient(160deg,#3E8C86,var(--teal-mid));}

  .section-label{padding:14px 18px 8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8B8368;}

  .provider-card{margin:0 18px 12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:12px;}
  .avatar{width:52px;height:52px;border-radius:12px;background:linear-gradient(160deg,#DDE6C8,#B9C79A);flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-size:20px;}
  .p-name{font-weight:700;font-size:13px;margin:0 0 2px;}
  .p-meta{font-size:11px;color:#8B8368;margin:0 0 4px;}
  .tag{font-size:9px;background:#F2ECDA;color:var(--teal-deep);padding:2px 7px;border-radius:20px;font-weight:600;}
  .p-price{margin-left:auto;text-align:right;font-size:11px;color:var(--red);font-weight:700;white-space:nowrap;}
  .badge-featured{background:var(--gold);color:#fff;font-size:8px;padding:2px 6px;border-radius:6px;font-weight:800;letter-spacing:.05em;}

  .btn{display:block;text-align:center;padding:13px 0;border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;border:none;width:100%;font-family:inherit;}
  .btn-primary{background:var(--red);color:#fff;}
  .btn-secondary{background:#fff;border:1px solid var(--line);color:var(--teal-deep);}
  .btn-dark{background:var(--teal-deep);color:#fff;}

  .field{margin:0 18px 14px;}
  .field label{display:block;font-size:11px;color:#8B8368;font-weight:700;margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:13px;
    font-family:inherit;color:var(--ink);}
  .field textarea{resize:vertical;min-height:60px;}
  .field .hint{font-size:10px;color:#B3AA92;margin-top:4px;}

  .cta-fixed{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 18px;margin-top:12px;}

  .empty{margin:40px 18px;text-align:center;color:#8B8368;font-size:13px;}
  .backlink{display:inline-block;padding:14px 18px 0;font-size:12px;font-weight:700;color:var(--teal-deep);}
</style>
{% block extra_head %}{% endblock %}
</head>
<body>
<div class="wrap">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
  <div style="text-align:center;padding:16px;font-size:11px;color:#8B8368;"><a href="{{ url_for('legal') }}" style="color:#8B8368;text-decoration:underline;">Terms, Privacy at Disclaimer</a></div>
</div>
</body>
</html>
