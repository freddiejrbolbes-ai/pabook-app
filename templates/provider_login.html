{% extends "base.html" %}
{% block title %}Provider Login — PaBook{% endblock %}
{% block content %}
<div style="padding:60px 24px;text-align:center;">
  <div style="font-size:40px;margin-bottom:12px;">🔒</div>
  <p style="font-family:'Fraunces',serif;font-weight:700;font-size:18px;margin:0 0 4px;">{{ provider.business_name }}</p>
  <p style="font-size:12px;color:#8B8368;margin:0 0 24px;">I-type ang access code mo para makapasok sa dashboard.</p>

  <form method="POST" style="max-width:280px;margin:0 auto;">
    <div class="field" style="margin:0 0 14px;">
      <input type="text" name="access_code" placeholder="6-digit code" maxlength="6" required
             style="text-align:center;font-size:20px;letter-spacing:.2em;font-weight:700;">
    </div>
    <button type="submit" class="btn btn-primary">Pasok</button>
  </form>

  <p style="font-size:11px;color:#8B8368;margin-top:20px;">Nakalimutan ang code mo? Tignan ang email mo mula sa PaBook, o i-contact ang support.</p>
</div>
{% endblock %}
